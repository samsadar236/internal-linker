name: Monthly Internal Linking Run

on:
  schedule:
    # 09:00 UTC on the 1st of every month
    - cron: "0 9 1 * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write         # needed to commit the report + snapshot back

concurrency:
  group: internal-linker-monthly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      START_URL: ${{ vars.START_URL }}
      USE_MOCK_DATA: ${{ vars.USE_MOCK_DATA }}
      LAUNCH_DATE: ${{ vars.LAUNCH_DATE }}
      MATOMO_BASE_URL: ${{ secrets.MATOMO_BASE_URL }}
      MATOMO_SITE_ID: ${{ vars.MATOMO_SITE_ID }}
      MATOMO_TOKEN: ${{ secrets.MATOMO_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Warn if still on mock data past launch
        if: ${{ vars.USE_MOCK_DATA == 'true' && vars.LAUNCH_DATE != '' }}
        run: |
          TODAY=$(date -u +%F)
          if [[ "$TODAY" > "${{ vars.LAUNCH_DATE }}" ]]; then
            echo "::warning::USE_MOCK_DATA is true but launch date ${{ vars.LAUNCH_DATE }} has passed. This run uses MOCK traffic, not real Matomo." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run pipeline
        run: python main.py

      - name: Commit report and snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RUN_DATE=$(date -u +%F)
          # reports are the permanent record; force-add the latest snapshot so
          # next month has a staleness baseline (snapshots are gitignored locally)
          git add reports/
          git add -f "snapshots/${RUN_DATE}.json" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Internal linking report ${RUN_DATE}"
            git push
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-linking-report
          path: |
            reports/*.xlsx
            reports/briefs/**
          retention-days: 90
          if-no-files-found: warn

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data '{"text":"internal-linker monthly run FAILED. See GitHub Actions logs."}' \
            "$SLACK_WEBHOOK_URL" || true
